name: Build early releases from source

# The earliest releases did not ship a browser zip. Build those from their source tags instead.
on:
  workflow_dispatch:

permissions:
  contents: write
  pages: write

concurrency: mirror

env:
  UP: tangency-labs/solidcraft
  APP: solidcraft
  GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
  TRUNK_VERSION: v0.21.14

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 340
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: wasm32-unknown-unknown

      - name: Install trunk
        run: |
          mkdir -p "$HOME/.local/bin"
          curl -sSL "https://github.com/trunk-rs/trunk/releases/download/${TRUNK_VERSION}/trunk-x86_64-unknown-linux-gnu.tar.gz" | tar -xz -C "$HOME/.local/bin"
          echo "$HOME/.local/bin" >> "$GITHUB_PATH"

      - name: Build every release that has no browser zip
        run: |
          git clone --quiet --filter=blob:none "https://github.com/$UP.git" up
          for tag in $(gh release list -R "$UP" --limit 400 --exclude-drafts --exclude-pre-releases --json tagName -q '.[].tagName'); do
            ver="${tag#v}"
            [ -d "v$ver" ] && continue
            if gh api "repos/$UP/releases/tags/$tag" --jq '.assets[].name' | grep -q -- '-web-.*\.zip$'; then continue; fi
            echo "::group::Build $tag"
            git -C up clean -fdxq -e target
            git -C up checkout --quiet --force "tags/$tag" || { echo "::warning::could not check out $tag"; continue; }
            dir=$(ls -d up/apps/*-web 2>/dev/null | head -n1)
            [ -n "$dir" ] || { echo "::warning::$tag has no web app, skipping"; continue; }
            rm -rf out; note=""
            build() { (cd "$dir" && trunk build --release --public-url ./ --dist "$GITHUB_WORKSPACE/out"); }
            if ! build; then
              echo "::warning::first build of $tag failed; retrying with wasm-opt disabled"
              sed -i 's|<link data-trunk rel="rust"\([^>]*\)/>|<link data-trunk rel="rust"\1 data-wasm-opt="0" />|' "$dir/index.html" || true
              rm -rf out
              note='Built with wasm-opt disabled (data-wasm-opt="0"); no other changes.'
              build || { echo "::warning::build failed for $tag"; git -C up checkout --quiet --force .; echo "::endgroup::"; continue; }
            fi
            git -C up checkout --quiet --force .
            [ -f out/index.html ] || { echo "::warning::$tag built no index.html"; echo "::endgroup::"; continue; }
            mkdir "v$ver"
            cp -a out/. "v$ver/"
            cp up/LICENSE* "v$ver/" 2>/dev/null || true
            printf 'Built from %s at tag %s\nhttps://github.com/%s/tree/%s\nThis release shipped no browser zip, so it was built from source with trunk build --release. %s\n' "$UP" "$tag" "$UP" "$tag" "$note" > "v$ver/SOURCE.txt"
            rm -rf out
            echo "::endgroup::"
          done
          rm -rf up

      - name: Update latest and versions.json
        run: |
          versions=$(find . -maxdepth 1 -type d -name 'v[0-9]*' -printf '%f\n' | sed 's/^v//' | sort -rV)
          latest=$(echo "$versions" | head -n1)
          echo "$versions" | jq -R . | jq -s --arg latest "$latest" '{latest: $latest, versions: .}' > versions.json
          cat versions.json

      - name: Keep the site under its size cap
        run: bash scripts/prune.sh

      - name: Commit and request a Pages build
        run: |
          git add -A
          if git diff --cached --quiet; then echo "Nothing new"; exit 0; fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git commit -m "Add early releases built from source"
          git push
          gh api -X POST "repos/${{ github.repository }}/pages/builds"
